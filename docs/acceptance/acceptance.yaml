  - id: AC25
    title: World-state design invariants hold on macOS
    trace: [DESIGN.L0_immutable, DESIGN.L1_append_only, DESIGN.L2_never_fused, DESIGN.first_observation,
            DESIGN.anchored_acceptance, DESIGN.publication_preconditions, ERD.ADMISSION_DECISION, ERD.AUDIT_RECORD]
    checks:
      - {kind: junit, tests: [tests/test_initial_world.py, tests/test_reviewed_world.py, tests/test_publication_recovery.py,
                              tests/test_anchored_fusion.py, tests/test_partial_static.py, tests/test_registration_recovery.py,
                              tests/mac/test_world_invariants.py::test_l0_tree_hash_unchanged_after_second_clip,
                              tests/mac/test_world_invariants.py::test_l1_v1_points_bytewise_subset_of_v2,
                              tests/mac/test_world_invariants.py::test_l2_points_absent_from_l1,
                              tests/mac/test_world_invariants.py::test_decision_constants]}
      - {kind: ast_module, file: geometry/atas_geometry/register/matching.py}
      - {kind: ast_module, file: geometry/atas_geometry/world/reviewed_world.py}
      - {kind: ast_identical_except_device_calls, file: geometry/atas_geometry/reconstruct/initial_world.py}
      - {kind: ast_identical_except_device_calls, file: geometry/atas_geometry/register/anchored_fusion.py}
      - {kind: ast_identical_except_device_calls, file: geometry/atas_geometry/world/writeback.py}
      - {kind: json, file: cuda_scan.json, assert: "d['decision_module_rebinding'] == []"}
    constants: {GROSS: 4, MIN_PAIRS: 3, MIN_COVERAGE: 0.8, tolerance_frac_median_depth: 0.02, min_sift: 30, max_references: 2}
    device_call_rule: >-
      Only these accel names may appear: backend, torch_device, compute_dtype, autocast, no_autocast,
      worker_env, device_type, synchronize, empty_cache, set_device, reset_peak_memory,
      peak_memory_bytes, peak_memory_source. Each maps one-to-one to the upstream expression it
      replaced: accel.backend()<->'cuda', accel.torch_device(i)<->torch.device(f'cuda:{device_index(i)}'),
      accel.compute_dtype()<->torch.bfloat16, accel.autocast()<->torch.autocast('cuda', dtype=torch.bfloat16),
      **accel.worker_env(i)<->CUDA_VISIBLE_DEVICES=gpu_selector(i), CUDA_DEVICE_ORDER='PCI_BUS_ID',
      accel.empty_cache()<->torch.cuda.empty_cache(), accel.reset_peak_memory()/peak_memory_bytes()
      <->the guarded torch.cuda peak calls. The comparator substitutes the upstream expression back,
      keeping every other argument, and then requires AST equality. Any other accel.* use, any new
      top-level statement, and any rebinding fail.
    rebinding_scan: "package-wide AST scan: no attribute assignment, setattr or del on atas_geometry.reconstruct/register/world modules or their functions outside tests"
    false_pass: "Invariant tests skipped, decision code edited, or decisions rebound at module level."
    guard: "Must-not-skip (AC21); decision modules whole-file AST-identical to upstream modulo device tokens."

