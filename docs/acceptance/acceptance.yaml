      - {kind: json, file: decisions.json, assert: "d['random_numbers'] == 'common' and d['crn_draw_sequences_equal'] is True and d['pairs_sha256'] == pre['e2e_pairs_sha256'] and d['clips_sha256'] == pre['analysis_clips_sha256'] and d['flips'] == {'initial_world_status': 0, 'registered': 0}"}
    status_mapping: "upstream initial_world statuses: unchanged (consistent, published as reconstructed), repaired (re-reconstructed against the first window and accepted), rejected (film only, r=0)"
    recapture_rule: "recapture of a committed event at its source times vs the source frames, PSNR over covered pixels; floor = max(20 dB absolute, CPU-fp32 recapture PSNR - 1 dB)"
    false_pass: "Synthetic shortcuts instead of real Pi3X + sam3.cpp; MPS changes accept/reject decisions."
    guard: "Run through the HTTP service on MPS with real weights; CPU and MPS decisions (first-observation class, r) compared on every analysis clip."
