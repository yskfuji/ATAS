    title: Real world-state loop on MPS (reconstruct, register, publish, recapture)
    trace: [QA.not_done.world_fusion_integration, QA.not_done.pi3x_integration, QA.not_done.sam3cpp_integration,
            ARCH.world, ARCH.geometry, ARCH.publication, ERD.WORLD_VERSION, ERD.OBSERVATION, ERD.STATIC_POINT_ASSET]
