# ATAS macOS geometry service — acceptance criteria (single source of truth).
# Revision 12: audit rounds 1-9 plus amendments A1-A12 (A10-A12 owner-authorised 2026-10-23) (A7-A9 authorised by the owner) (docs/acceptance/ACCEPTANCE_AUDIT.md), made
# before any analysis-clip measurement existed.
#
# Status of every AC is computed by tools/evidence_gate.py from evidence files registered in
# evidence/<run-id>/manifest.json. Hand-entered statuses are never read.
# Statuses: PASS | FAIL | BLOCKED. NOT_APPLICABLE is forbidden for every AC in this file.
# check kinds:
#   junit:        every listed pytest node id (or every test in a listed file) exists in the run's
#                 junit XML and passed; a skipped listed test is a FAIL
#                 A listed id without "[...]" means every parametrization of it, and at least one must exist (A3).
#                 For a file-level entry the only tolerated skips are ids on the locked skip_allowlist (CUDA-hardware
#                 variants), and only when the same test's "[mps]" variant passed in the same run (A3).
#   json:         JSON evidence file registered in the manifest; `assert` is a Python expression over
#                 d    = the parsed file,
#                 ev   = {filename: parsed} for every registered evidence file; ev['junit'] =
#                        {'passed': {test_id: bool}, 'skipped': [...]} parsed from the run's junit XML,
#                 m    = manifest.json,
#                 pre  = merged preregistration: this file's `preregistration` block, then every key of
#                        margins.json (perf_clip_frames, jf_floor, jf_floor_source, margins), then
#                        <name>_sha256 for each file in preregistration.clip_lists / margins_file /
#                        e2e_pairs (keys: calibration_clips_sha256, pilot_clips_sha256,
#                        analysis_clips_sha256, margins_sha256, e2e_pairs_sha256) as recorded in
#                        acceptance.lock; a key collision is a gate error
#                 gate = values the gate computes itself (never read from evidence):
#                        required_n, sam3_sec_per_frame_budget, must_not_skip, fallback_allowlist,
#                        device_divergence_ids, skip_allowlist (parsed from locked files)
#   ast_module:   whole-module AST identical to upstream (optionally allowing exactly one top-level
#                 `if sys.platform == "darwin":` block plus imports)
#   ast_identical_except_device_calls: see AC25 device_call_rule
#   blocked:      cannot be evidenced in this scope
# Verdict rules (gate):
#   * a missing, unregistered or hash-mismatched evidence file makes its check FAIL (never BLOCKED)
#   * blocked checks are allowed only in AC23 and AC24; the gate asserts exactly 7 exist
#   * AC status: FAIL if any non-blocked check fails; PARTIAL if all non-blocked checks pass and the
#     AC has a blocked check (AC23); BLOCKED if it has only blocked checks (AC24); otherwise PASS
#   * overall_verdict = "IN_SCOPE_PASS (BLOCKED: 7)" iff AC01-AC22, AC25, AC26 are PASS and AC23 is
#     PARTIAL; otherwise "FAIL". A bare "PASS" is never printed.
#   * preregistration order: the lock commit (acceptance.lock) must be a git ancestor of every
#     commit that adds MPS evidence, and no MPS evidence file may exist in the lock commit's tree
schema: atas-macos-acceptance-v11
upstream: {repo: ziplab/ATAS, commit: b86aab046368}
target_hardware: {brand_contains: "Apple M4 Pro", memsize_bytes: 51539607552}

preregistration:
  # Frozen (sha256 recorded in docs/acceptance/acceptance.lock) BEFORE the first MPS measurement.
  # The pilot and calibration clips are disjoint from the analysis clips and excluded from it.
  clip_lists: {calibration: evidence/prereg/calibration_clips.json,
               pilot: evidence/prereg/pilot_clips.json,
               analysis: evidence/prereg/analysis_clips.json}   # each entry: dataset, sequence, frame range, sha256
  margins_file: evidence/prereg/margins.json   # numbers computed from CPU-fp32 on the calibration set only
  margin_rules:
    depth_absrel: "max(0.01, 0.10 * mean_cpu_fp32_absrel_calibration)  # floor dominates when baseline < 0.1"
    ate: "0.05 * mean_cpu_fp32_ate_calibration"
    rpe: "0.05 * mean_cpu_fp32_rpe_calibration"
  primary_test: "paired t-TOST on per-clip differences (MPS minus CPU-fp32), alpha=0.05 per side"
  sensitivity_test: "BCa cluster bootstrap by clip, 10000 resamples, seed 20261019, 90% CI inside margin"
  both_must_pass: true
  multiplicity: "intersection-union over k=3 geometry metrics (Berger & Hsu 1996); no alpha correction"
  power: "joint power 0.8 -> per-metric power 0.8^(1/3)=0.928"
  sample_size: "smallest n with exact paired-t TOST power >= 0.928 at true diff 0 and pilot sigma_d/delta; gate recomputes it"
  min_analysis_clips: 29
  sigma_for_sizing: "80% upper confidence limit of the pilot SD of per-clip differences (chi-square, df = pilot_n - 1)"
  perf_workload: {clip_frames: "90th percentile of analysis clip lengths, frozen in margins.json as perf_clip_frames", recon_wh: [1280, 720]}
  jf_floor: "frozen in margins.json with citation (published DAVIS-17 val J&F for the prompt protocol used, minus 0.03)"
  recapture_psnr_abs_floor_db: 20.0
  render_coverage_floor: 0.5   # A9
  e2e_pairs: evidence/prereg/e2e_pairs.json   # preregistered (history clip, new clip) pairs within one scene
  # Service defaults pass --low_vram, which the recon script turns into the effective values below.
  pi3x_settings: {recon_wh: [1280, 720], requested: {pi3_pixel_limit: 255000, pi3_vo_chunk: 48},
                  effective: {pi3_pixel_limit: 160000, pi3_vo_chunk: 24, pi3_vo_overlap: 6}, low_vram: true}
  random_numbers: >-
    A5. Device comparisons (AC10, AC12, AC13, AC26 decisions) run under common random numbers: the
    evaluation harness (tools/crn_launch.py) makes every torch.rand draw come from one seeded CPU
    generator and moves it to the device, so both devices receive identical random numbers in the same
    order. Production code is unchanged. Upstream Pi3X draws a depth-scale augmentation with torch.rand
    at inference time, so two native CPU runs of one clip already differ. The native-RNG CPU-vs-CPU
    difference is reported separately as the upstream noise floor (informative, not a pass condition).
    Round-5 fixes: every evaluation process installs CRN itself (GEOMETRY_EVAL_CRN_SEED) and logs
    crn_installed plus a hash of its draw sequence; CPU and MPS sequences must be equal (identical control
    flow); rand, rand_like, randn, randn_like, randperm and Tensor.uniform_ are covered; a Pi3X forward in
    training mode aborts. Device comparisons use three CRN seeds (20261019-20261021): AC12 takes the
    per-clip maximum over seeds, AC13 the per-clip mean. Native-RNG CPU repeats (5 per analysis clip)
    give the noise floor and the production decision stability (informative). Production-mode ACs
    (native RNG, as shipped): AC14, AC15, AC22 and AC26's HTTP world loop.
  accuracy_protocol: >-
    A6. Depth accuracy is median-scaled per sequence, with ground truth capped at 70 and aligned
    predictions clipped at 70, following MonST3R's published evaluation (depth_metric.ipynb,
    max_depth=70 for Sintel and Bonn). ATE and RPE are computed after Umeyama Sim(3) alignment.
  determinism:
    clip_selection: "every clip list is generated by tools/prereg.py from whole named sequences with a fixed seed (20261019); the gate re-runs it and compares hashes"
    margins: "the gate recomputes margins.json from the CPU-fp32 calibration evidence and must reproduce it exactly"
  residual_risk: >-
    The repository is local (owner decision: no push), so git ancestry, not an external timestamp,
    attests that preregistration preceded MPS runs. The impact is neutralised because clip lists and
    margins are deterministic functions of CPU-only data that the gate recomputes; seeing MPS results
    first cannot change them.

acs:
  - id: AC01
    title: Single device helper; no stray CUDA literals
    trace: [QA.not_done.macos_patch, ARCH.geometry, QA.done.device_decision]
    checks:
      - {kind: junit, tests: [tests/mac/test_device.py::test_cuda_branch_identity,
                              tests/mac/test_device.py::test_mps_branch,
                              tests/mac/test_device.py::test_cpu_branch,
                              tests/mac/test_device.py::test_backend_never_imports_torch]}
      - {kind: json, file: cuda_scan.json, assert: "d['unallowlisted'] == []"}
    false_pass: "Helper exists but call sites still hardcode cuda; or the CUDA branch silently differs."
    guard: "Static scan of atas_geometry/ and the backbone recon path with a per-line allowlist; CUDA branch compared object-for-object under mock."

  - id: AC02
    title: Service starts without nvidia-smi
    trace: [QA.not_done.macos_patch, ARCH.geometry]
    checks:
      - {kind: junit, tests: [tests/mac/test_routes.py::test_startup_without_nvidia_smi,
                              tests/mac/test_routes.py::test_cuda_device_still_selects_nvidia_pool]}
    false_pass: "Startup passes because CUDA probing is disabled for every platform."
    guard: "GEOMETRY_DEVICE=cuda must still construct the upstream GpuPool."

  - id: AC03
    title: /readyz is honest on macOS
    trace: [QA.done.mac_preflight, ARCH.geometry]
    checks:
      - {kind: junit, tests: [tests/mac/test_routes.py::test_readyz_all_ok,
                              tests/mac/test_routes.py::test_readyz_missing_dependency]}
      - {kind: json, file: readyz_live.json, assert: "d['status_code'] == 200 and d['body']['ready'] is True and d['body']['dependencies']['accelerator_probe']['ok'] is True and d['body']['dependencies']['accelerator_probe']['detail']['device'] == 'mps'"}
    false_pass: "Probe runs in the parent (env frozen) or only checks is_available()."
    guard: "Fresh-subprocess probe runs an MPS matmul compared with CPU; removing each dependency yields 503 naming it."

  - id: AC04
    title: All HTTP routes and bearer auth
    trace: [ARCH.world, ARCH.publication]
    checks:
      - {kind: junit, tests: [tests/mac/test_routes.py::test_auth_required,
                              tests/mac/test_routes.py::test_render_requires_camera_contract,
                              tests/mac/test_routes.py::test_job_fingerprint_dedupe,
                              tests/mac/test_routes.py::test_unknown_job_404,
                              tests/mac/test_routes.py::test_healthz_no_auth]}
    false_pass: "Routes mocked away entirely."
    guard: "Tests drive the real create_app() with a temporary hot_root."

  - id: AC05
    title: Worker ownership on macOS (replaces /proc)
    trace: [QA.not_done.macos_patch]
    checks:
      - {kind: junit, tests: [tests/mac/test_worker_ownership_darwin.py::test_live_worker_is_running,
                              tests/mac/test_worker_ownership_darwin.py::test_killed_worker_lease_is_released,
                              tests/mac/test_worker_ownership_darwin.py::test_reused_pid_lease_rejected,
                              tests/mac/test_worker_ownership_darwin.py::test_boot_mismatch_returns_empty,
                              tests/mac/test_worker_ownership_darwin.py::test_nested_member_found_and_reaped,
                              tests/mac/test_worker_ownership_darwin.py::test_exiting_process_counts_as_live]}
      - {kind: ast_module, file: geometry/atas_geometry/service/worker_protocol.py, allow_darwin_block: true}
    false_pass: "Ownership always returns None, so the lease looks 'running forever' and tests stay green."
    guard: "Kill test must observe lease_running()==False, process reaped and no lease quarantine."

  - id: AC06
    title: Deadlines and heartbeat enforced on macOS
    trace: [QA.not_done.macos_patch]
    checks:
      - {kind: junit, tests: [tests/test_worker_resilience.py::test_hung_owned_worker_has_deadline_and_is_reaped,
                              tests/test_worker_resilience.py::test_health_remains_responsive_during_owned_worker_spin,
                              tests/test_worker_resilience.py::test_modern_lease_does_not_signal_a_reused_leader_pid,
                              tests/test_worker_resilience.py::test_live_unverified_lease_cannot_be_reconciled,
                              tests/test_worker_resilience.py::test_real_isolated_rpc_returns_structured_failure_without_gpu,
                              "tests/test_worker_resilience.py::test_exited_leader_does_not_leave_nested_worker_or_release_a_live_group[False]",
                              "tests/test_worker_resilience.py::test_exited_leader_does_not_leave_nested_worker_or_release_a_live_group[True]",
                              tests/mac/test_device.py::test_upstream_deadline_defaults_unchanged]}
    expected_defaults:
      dataclass: {recon_deadline_seconds: 900, render_deadline_seconds: 300, rpc_deadline_seconds: 120, worker_heartbeat_timeout: 90}
      from_env: {recon_deadline_seconds: 2400, render_deadline_seconds: 900, rpc_deadline_seconds: 300, worker_heartbeat_timeout: 90}
      heartbeat_interval_seconds: 5
    false_pass: "Production deadlines shortened to make tests pass."
    guard: "Both default sets and the heartbeat interval asserted equal to upstream."

  - id: AC07
    title: Unified-memory admission
    trace: [QA.not_done.m4pro_measure, ARCH.geometry]
    checks:
      - {kind: junit, tests: [tests/mac/test_unified_pool.py::test_admits_within_budget,
                              tests/mac/test_unified_pool.py::test_refuses_over_budget_with_upstream_error,
                              tests/mac/test_unified_pool.py::test_single_lease,
                              tests/mac/test_unified_pool.py::test_requirements_match_upstream,
                              tests/mac/test_unified_pool.py::test_parent_admission_never_queries_torch_mps,
                              tests/mac/test_unified_pool.py::test_admission_uses_probe_value]}
      - {kind: json, file: hw.json, assert: "d['mps']['recommended_max_memory'] >= 24576 * 2**20"}
    requirements_mib: {recon: 24576, render: 2048}   # max(15360, 24576) and 2048 in jobs.py
    false_pass: "Parent reads its own MPS allocator (about 0) and admits everything."
    guard: "Telemetry from a probe subprocess plus host VM statistics; every torch.mps query is made to raise in the parent while it starts, answers /readyz and admits a job (A1)."

  - id: AC08
    title: Resident models over AF_UNIX on macOS
    trace: [QA.not_done.macos_patch]
    checks:
      - {kind: junit, tests: [tests/mac/test_resident_darwin.py::test_socket_path_fits_sun_path,
                              tests/mac/test_resident_darwin.py::test_af_unix_roundtrip_real_server,
                              tests/test_resident_execution.py]}
    false_pass: "Resident mode silently disabled."
    guard: "A real resident server is started and answers over AF_UNIX; path fits the 104-byte darwin sun_path."

  - id: AC09
    title: Child-process environment
    trace: [QA.done.device_decision]
    checks:
      - {kind: junit, tests: [tests/mac/test_device.py::test_child_env_cuda_identical,
                              tests/mac/test_device.py::test_child_env_mps,
                              tests/mac/test_device.py::test_child_env_effective_in_child]}
    false_pass: "MPS variables set after the child imported torch (ignored)."
    guard: "The child reports the variables seen before importing torch; the CUDA env dict equals the upstream construction."

  - id: AC10
    title: Pi3X dtype selection is evidence-based
    trace: [QA.not_done.pi3x_integration]
    checks:
      - {kind: json, file: pi3_dtype_report.json, assert: "d['selected'] in d['eligible'] and all(r['nonfinite'] == 0 for r in d['runs'] if r['dtype'] == d['selected']) and (d['selected'] == 'float32' or d['speedup_vs_fp32'][d['selected']] >= 1.25)"}
      - {kind: json, file: parity.json, assert: "d['dtype'] == ev['pi3_dtype_report.json']['selected']"}
    scope: "the probe covers both Pi3X paths: plain windowed reconstruction (recon_pi3) and history-conditioned reconstruction (anchored_fusion / temporal_chunk_repair)"
    false_pass: "Overflow hidden by downstream nan_to_num; reduced dtype picked without passing parity."
    guard: "Hooks inside attention/MLP blocks record activations before any sanitization; the selected dtype must pass AC12 at reduced-precision limits."

  - id: AC11
    title: Attention backend on MPS
    trace: [QA.not_done.pi3x_integration]
    checks:
      - {kind: junit, tests: [tests/mac/test_pi3_mps.py::test_attention_mps_matches_cpu,
                              tests/mac/test_pi3_mps.py::test_cuda_bf16_still_forces_flash]}
    tolerance: {fp32_max_rel: 1.0e-5, fp32_max_abs: 1.0e-5}
    false_pass: "The patch also changes CUDA kernel selection."
    guard: "The CUDA branch is asserted (under mock) to still request SDPBackend.FLASH_ATTENTION for bf16."

  - id: AC12
    title: Numerical parity MPS vs CPU-fp32 (same code and settings, except the MPS-only CPU placement of Pi3XVO's 3x3 SVD)
    trace: [QA.not_done.pi3x_integration, ARCH.geometry]
    checks:
      - {kind: json, file: parity.json, assert: "d['random_numbers'] == 'common' and min(d['crn_seeds_per_clip']) >= 3 and d['order_floor_clips'] == d['n_clips'] and d['noise_floor_clips'] == d['n_clips'] and min(d['order_floor_seeds']) >= 3 and d['clips_passing_only_via_N'] <= 0.1 * d['n_clips'] and d['pre_svdfix_measured_clips'] >= 29 and d['pre_svdfix_worst_fails'] is True and len(d['pre_svdfix_rescued']) < len(d['pre_svdfix_failed_original']) and 'all_clips_pass_original' in d and d['rotation_metric'] == 'atan2_A12' and 'pre_A12' in d and d['all_clips_pass'] is True and set(d['paths']) == {'windowed', 'anchored'} and d['clip_list_sha256'] == pre['analysis_clips_sha256'] and d['n_clips'] >= 29 and d['summary'] == 'per_clip_max_over_frames' and d['units'] == 'raw' and d['normaliser_mask'] == 'l1_static' and d['pi3x_settings'] == pre['pi3x_settings']"}
    thresholds:   # engineering limits, not derived bounds (see ACCEPTANCE.md)
      fp32: {depth_absrel: 1.0e-3, rot_deg: 0.05, trans_frac_depth: 1.0e-3, chamfer_frac_extent: 1.0e-3}
      reduced: {depth_absrel: 1.0e-2, rot_deg: 0.25, trans_frac_depth: 5.0e-3, chamfer_frac_extent: 5.0e-3}
    amended_rule: >-
      A12 (owner-authorised, 2026-10-23, docs/acceptance/A12.md): the rotation metric is the stable atan2 form; the original arccos numbers, the verdicts
      they give and the A7 terms O and N recomputed in the corrected metric are reported side by side (parity.json pre_A12). L is unchanged.
      A7 (owner-authorised, 2026-10-20, defined before any post-SVD-fix MPS analysis result was examined):
      per analysis clip: D_k <= max(L_k, 2 * O_k) for depth, translation and Chamfer, and
      D_rot <= max(L_rot, 2 * O_rot, min(0.1 * N_rot, 0.25 deg)) for rotation. D_k = MPS-vs-CPU-fp32 deviation
      (CRN, maximum over 3 seeds); L_k = the fp32 or reduced limit above; O_k = the CPU-fp32 summation-order
      floor, the median over the 3 CRN seeds of CPU at 10 vs 4 threads (OMP/VECLIB pinned; a 1-thread arm was
      not run: ~40 h); N_rot = the upstream production noise floor (median over native-RNG CPU repeats 1-4
      of their deviation from repeat 0), capped at the reduced-precision limit. 2*O_k admits a second
      legitimate summation order (triangle inequality). Round-6 conditions: at most 10 % of clips may pass
      only through the N term; the rule is also applied to the stored pre-SVD-fix MPS results, which must
      fail; per-clip detection thresholds (the amended limits) and the term that set each one are reported;
      the verdict under the original limits (all_clips_pass_original) is reported alongside.
    normalisers: >-
      Both normalisers use only pixels in the L1 static mask of the CPU run (no dynamic regions, sky
      or unstable depth edges), as L1 fusion does. trans_frac_depth = |t_mps - t_cpu| / median
      static CPU depth of the clip (A2: camera-path extent is ill-conditioned for low-motion clips).
      chamfer_frac_extent = symmetric Chamfer / ||P98 - P2|| of the static CPU points per axis
      (robust scene extent; a min/max bounding box would let one outlier set the limit).
    false_pass: "Outputs normalized by their own scale; mean over frames hides a bad frame; a different dtype or setting tested."
    guard: "Raw units, per-clip maximum over frames, dtype bound to AC10, settings bound to the preregistration."

  - id: AC13
    title: Ground-truth geometry accuracy equivalence (TOST)
    trace: [QA.not_done.quality_noninferiority]
    checks:
      - {kind: json, file: stats/tost.json, assert: "d['margins_sha256'] == pre['margins_sha256'] and d['analysis_clips_sha256'] == pre['analysis_clips_sha256'] and d['n_clips'] >= max(29, gate['required_n']) and all(m['t_tost_equivalent'] and m['bca_bootstrap_equivalent'] for m in d['metrics'].values()) and set(d['metrics']) == {'depth_absrel', 'ate', 'rpe'}"}
    false_pass: "Frames pooled as independent units; margins tuned after seeing MPS data; clips cherry-picked."
    guard: "Clip is the unit; margins and clip lists frozen with hashes before the first MPS run; the gate recomputes required n from the pilot."

  - id: AC14
    title: Fusion / registration / render run on MPS
    trace: [QA.not_done.world_fusion_integration, ARCH.geometry]
    checks:
      - {kind: junit, tests: [tests/test_geometry_core_v2.py, tests/test_raster_pixel_centres.py,
                              tests/test_alignment_refinement.py, tests/test_static_footprint.py,
                              tests/test_dynamic_footprint.py, tests/test_recapture_gpu.py,
                              tests/test_cinematic_camera.py]}
      - {kind: json, file: render_parity.json, assert: "d['voxel_count_rel_diff'] <= 1e-3 and d['psnr_covered_union_min_db'] >= 40 and d['coverage_iou_min'] >= 0.995 and set(d['fallback_ops']) <= set(gate['fallback_allowlist'])"}
    false_pass: "Grey unobserved pixels inflate PSNR; the MPS path silently falls back to CPU."
    fallback_allowlist_file: tests/mac/mps_fallback_allowlist.txt   # hashed in the lock
    guard: "PSNR over the union of covered pixels; a run with PYTORCH_ENABLE_MPS_FALLBACK=0 enumerates fallback ops against the locked allowlist file."

  - id: AC15
    title: SAM3 segmentation/tracking path (sam3.cpp)
    trace: [QA.not_done.sam3cpp_integration, ARCH.geometry]
    checks:
      - {kind: junit, tests: [tests/mac/test_sam3_cpp_runner.py::test_schema_conversion,
                              tests/mac/test_sam3_cpp_runner.py::test_backend_switch,
                              tests/mac/test_sam3_cpp_runner.py::test_empty_tracks]}
      - {kind: json, file: sam3_quantisation.json, assert: "d['rule'] == 'A8' and d['selection_set'] == 'davis2017_train_20_seed20261019' and set(d['eligible']) == set(gate['sam3_eligible']) and d['selected'] == gate['sam3_selected'] and d['timing_frames'] == pre['perf_clip_frames'] and d['power_source'] == 'AC Power' and (d['selected'] == 'f16' or d['selected'] in m['weights_selected_sam3'])"}
      - {kind: json, file: sam3_parity.json, assert: "d['variant'] == ev['sam3_quantisation.json']['selected'] and d['jf_tost_equivalent_vs_f32_cpu'] is True and d['jf_margin'] == 0.02 and d['jf_davis17_val'] >= pre['jf_floor'] and d['timing']['clip_frames'] == pre['perf_clip_frames'] and d['timing']['sec_per_frame_max'] <= gate['sam3_sec_per_frame_budget'] and d['peak_footprint_bytes'] <= ev['hw.json']['mps']['recommended_max_memory'] - 24576 * 2**20"}
    budget_rule: "gate: sam3_sec_per_frame_budget = 0.5 * 1800 / pre['perf_clip_frames'] (half of AC22 recon headroom)"
    quantisation_rule: >-
      A8 (owner-authorised, 2026-10-20, registered before any quantised model was run): candidates
      sam3-q8_0 and sam3-q4_0 on Metal. Selection uses a set disjoint from the AC15 verdict data: 20
      DAVIS-2017 *train* sequences drawn with seed 20261019 (same protocol). A candidate is eligible if its
      J&F there is equivalent to Metal f16 (paired t-TOST and BCa, margin 0.02), its mean J&F >= pre['jf_floor'],
      its sec/frame (maximum over >= 5 fresh-process runs, interleaved across models, first Metal-compile run
      reported separately, mains power, Low Power off) on the AC22 workload is >= 1.25x faster than f16's, and
      its peak footprint is not above f16's. The fastest eligible candidate becomes the production model and
      the subject of AC15 (judged on DAVIS-2017 val); otherwise f16 stays. Its .ggml is hashed in the manifest.
    floor_rule: "pre['jf_floor'] = published DAVIS-2017-val J&F for the same prompt protocol minus 0.03, with citation"
    memory_rule: "recommended_max_memory - 24576 MiB is a deliberately conservative proxy: the whole recon admission is reserved for Pi3X although SAM3 and Pi3X run sequentially"
    false_pass: "sam3.cpp compared only with itself."
    guard: "Absolute floor on DAVIS ground truth; the PyTorch SAM3 reference is BLOCKED (AC24); GGML weights hashed with provenance."

  - id: AC16
    title: Atomic publication and rejected-clip invariance
    trace: [ARCH.publication, QA.done.atomic_pointer, DESIGN.rejected_never_mutates]
    checks:
      - {kind: junit, tests: [tests/mac/test_publication_invariance.py::test_rejected_job_leaves_tree_hash,
                              tests/mac/test_publication_invariance.py::test_stale_parent_conflict,
                              "tests/mac/test_publication_invariance.py::test_sigkill_is_all_or_nothing[before_manifest]",
                              "tests/mac/test_publication_invariance.py::test_sigkill_is_all_or_nothing[between_manifest_and_pointer]",
