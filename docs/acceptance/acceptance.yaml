  - id: AC22
    title: Performance and memory on M4 Pro 48GB
    trace: [QA.not_done.m4pro_measure]
    checks:
      - {kind: json, file: perf.json, assert: "d['n_runs'] >= 5 and d['clip_frames'] == pre['perf_clip_frames'] and d['recon_wh'] == [1280, 720] and d['pi3x_settings'] == pre['pi3x_settings'] and d['dtype'] == ev['pi3_dtype_report.json']['selected'] and d['recon_max_s'] <= 1800 and d['peak_footprint_bytes_max'] <= d['recommended_max_memory'] and d['swap_delta_mb_max'] <= 256 and d['memory_source'] == 'darwin_lifetime_max_phys_footprint'"}
      - {kind: json, file: render_remeasure.json, assert: "d['n_runs'] >= 5 and d['coverage_min'] >= pre['render_coverage_floor'] and d['render_max_s'] <= 675 and d['source_world'] == pre['e2e_world_pair_new'] and d['source_world_sha256'] == pre['e2e_world_pair_new_sha256'] and d['world_version'] == ev['e2e_world.json']['world_chain'][0] and d['subject_visible_fraction_min'] >= 0.8 and d['subject_center_in_frame_all'] is True and d['grey_fraction_max'] <= 0.5 and d['distinct_camera_poses'] >= 3 and d['cache_hits'] == 0 and d['cpu_render_check']['coverage_min'] >= pre['render_coverage_floor'] and d['cpu_render_check']['subject_visible_fraction_min'] >= 0.8 and d['memory_source'] == 'darwin_lifetime_max_phys_footprint' and d['peak_footprint_bytes_max'] <= d['recommended_max_memory']"}
    render_rule: >-
      A9 (owner-authorised, 2026-10-22; defined after seeing that the perf-lane renders had mean coverage
      0.0953-0.0958 and showed almost only unobserved grey, because the perf clip (freiburg1_floor) has no
      person and the planner stand-in grounded on a false SAM3 track): render time is taken from at least 5
      renders of the preregistered AC26 world (the TUM pair `e2e_world_pair`, a real person subject) through
      the same MPS service, each with a distinct shot id and a locked camera, each required to reach mean
      coverage >= pre['render_coverage_floor'] = 0.5 (a conservative floor, fixed here before that world was
      rendered) AND, computed by the harness from the world and the file (not from the render's report): the
      subject (the SAM3 person track's points) covers >= 2 % of the frame on >= 80 % of frames, its centre
      stays in frame, the share of flat grey pixels is <= 0.5, >= 3 distinct camera poses were rendered
      (side offsets 20, 12, 28, 16, 24 degrees), no render was a cache hit, and two renders of the CPU E2E
      world through a CPU service pass the same coverage and visibility rule, which shows the floor is
      passable on CPU. The perf-lane render times stay in perf.json as reported
      numbers but no longer carry the pass condition. recon time, memory and swap remain judged on perf.json.
    false_pass: "A single warm run, a short clip, RSS (which misses Metal buffers), or a render that draws almost nothing."
    guard: "All runs reported (first fresh-process run separately), workload pinned, peak = lifetime max physical footprint per process tree; the render must actually cover the frame."

